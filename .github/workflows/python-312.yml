name: Python 3.12 tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-312-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_SECRET_KEY: ci-only-secret-key-not-used-outside-tests
      PEPPER: ci-only-password-pepper-not-used-outside-tests
      OPENAI_KEY: ci-only-openai-key-not-used-outside-tests
      DATABASE: Aurvek.db
      ENVIRONMENT: test
      SECURITY_REDIS_MODE: "off"
      USE_EMAIL_SERVICE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-linux.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libmagic1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-linux.txt

      - name: Initialize test database
        run: python init_db.py

      - name: Run test suite
        run: python -m pytest -q
