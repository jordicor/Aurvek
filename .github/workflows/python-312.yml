name: Python 3.12 tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-312-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build clean public CI environment
        run: git archive HEAD | docker build --tag aurvek-public-ci --file .github/ci/Dockerfile -

      - name: Run complete public CI
        run: docker run --rm --network none aurvek-public-ci
