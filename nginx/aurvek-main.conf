# aurvek-main.conf
# Main AURVEK Nginx configuration with authenticated file serving
#
# Replace placeholders before use:
#   {{AURVEK_ROOT}}       -> Your AURVEK installation path (e.g., /var/www/aurvek)
#   {{FASTAPI_PORT}}     -> FastAPI port (default: 7789)
#   {{PRIMARY_DOMAIN}}   -> Your primary domain (e.g., app.yourdomain.com)
#   {{SSL_CERT}}         -> Path to SSL certificate
#   {{SSL_KEY}}          -> Path to SSL private key
#   {{SNIPPETS_PATH}}    -> Path to nginx snippets directory
#   {{ALIASES_PATH}}     -> Path to nginx alias includes directory

# GLOBAL SETTING (add to nginx.conf http block): server_tokens off;

# ==============================================================================
# URL PARSING MAPS
# ==============================================================================

# Extract JWT token from URL query parameter
map $request_uri $extracted_token {
    "~*token=(?<tok>[^&]+)" $tok;
}

# Extract clean path without query string
map $request_uri $clean_uri {
    "~^(?<path>[^?]+)" $path;
}

# Maps for extracting parts of prompt URLs
map $request_uri $prompt_id {
    "~^/([0-9]+)/" $1;
    default "";
}

map $request_uri $prompt_name {
    "~^/[0-9]+/([^/]+)/" $1;
    default "";
}

map $request_uri $remaining_path {
    "~^/[^/]+/[^/]+/(.*)$" $1;
    default "";
}

# Determine content type for downloads
map $uri $contents_type {
    ~\.mp3$ "audio/mpeg";
    ~\.pdf$ "application/pdf";
}

# Check if download parameter is present
map $args $is_download {
    default 0;
    "~*download=true" 1;
}

# ==============================================================================
# MAIN SERVER BLOCK
# ==============================================================================
# This server block handles requests to the primary domain only.
# The catch-all default_server is in aurvek-custom-domains.conf.

server {
    listen 80;
    listen 443 ssl;
    server_name {{PRIMARY_DOMAIN}};

    if ($aurvek_redirect_to_https) {
        return 308 https://$host$request_uri;
    }

    root "{{AURVEK_ROOT}}/data/";
    index index.html index.htm;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Block scanners/bots
    if ($is_scanner_request) {
        return 444;
    }

    # Block database files from being served
    location ~* \.(db|sqlite|sqlite3|db-wal|db-shm)$ {
        deny all;
        return 404;
    }

    # Hard fail on unexpected host values inside this server block
    if ($host != "{{PRIMARY_DOMAIN}}") {
        return 444;
    }

    allow all;

    include "{{ALIASES_PATH}}/*.conf";

    # --------------------------------------------------------------------------
    # Clean URLs for marketing pages (serve .html files at clean paths)
    # --------------------------------------------------------------------------
    location = /for-creators { include {{SNIPPETS_PATH}}/fastapi-proxy.conf; }
    location = /for-teams { try_files /for-teams-landing.html =404; }
    location = /for-agencies { include {{SNIPPETS_PATH}}/fastapi-proxy.conf; }

    # 301 redirects from old .html URLs to clean URLs
    location = /for-creators-landing.html { include {{SNIPPETS_PATH}}/fastapi-proxy.conf; }
    location = /for-teams-landing.html { return 301 /for-teams; }
    location = /for-agencies-landing.html { include {{SNIPPETS_PATH}}/fastapi-proxy.conf; }
    location = /explore-landing { include {{SNIPPETS_PATH}}/fastapi-proxy.conf; }
    location = /explore-landing.html { include {{SNIPPETS_PATH}}/fastapi-proxy.conf; }

    # --------------------------------------------------------------------------
    # Static assets - serve with long cache and security headers
    # --------------------------------------------------------------------------
    location /static/ {
        # data/static also contains server-side artifacts; expose only browser
        # assets and the audio/video formats the UI intentionally consumes.
        if ($uri !~* \.(css|js|mjs|map|json|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot|txt|xml|webmanifest|mp3|mp4|webm|opus)$) {
            return 404;
        }
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        include {{SNIPPETS_PATH}}/security-headers.conf;
        access_log off;
    }

    # Runtime-private stores are never served directly. Their public interfaces
    # are authenticated FastAPI routes/WebSockets, not capability URLs here.
    location ^~ /file_blobs/ { return 404; }
    location ^~ /jobs/       { return 404; }
    location ^~ /cache/      { return 404; }
    location ^~ /archive/    { return 404; }
    location ^~ /config/     { return 404; }
    location ^~ /seed/       { return 404; }
    location ^~ /staging/    { return 404; }

    # --------------------------------------------------------------------------
    # Default Location - allowlisted public static files only (no FastAPI fallback)
    # Specific application and authenticated-user regex locations below still
    # take precedence over this plain prefix location.
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=general burst=20 nodelay;

        # Only formats Aurvek intentionally renders as public web assets.
        if ($uri !~* \.(html?|css|js|mjs|map|json|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot|txt|xml|webmanifest)$) {
            return 404;
        }

        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Root path - FastAPI decides whether to serve the public landing or the
    # private login based on the marketplace kill switch.
    # --------------------------------------------------------------------------
    location = / {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    location = /index.html {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # --------------------------------------------------------------------------
    # FastAPI Application Routes (EXPLICIT - add new routes here)
    # --------------------------------------------------------------------------

    # Auth & Session
    location ~ ^/(login|logout|magic-link-recovery)(/|$) {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # OAuth providers (Google, future: Facebook, Apple, etc.)
    location ~ ^/auth/(google|facebook|apple)(/callback)?(/|$) {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # Registration & Verification
    location ~ ^/(register|create-user)(/|$) {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # Email verification - strict token format (43 chars base64 URL-safe)
    # Rejects malformed tokens at nginx level (protects FastAPI from scanners)
    location ~ "^/verify-email/[A-Za-z0-9_-]{43}$" {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # Main App
    location ~ ^/(chat|edit-profile|edit-user|upload-profile-picture)(/|$) {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # Admin
    location ~ ^/(admin|users-list|metrics|prompts|landing|user)(/|$) {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # Creator area
    location ~ ^/(my-usage|my-earnings|my-branding|curation-settings|find-user)(/|$) {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # Twilio Voice callbacks are deliberately separate from the public static
    # fallback. Twilio sends these callbacks as POST requests and Aurvek
    # validates their signatures against PRIMARY_APP_DOMAIN.
    location = /webhooks/twilio/voice/inbound {
        limit_except POST { deny all; }
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    location = /webhooks/twilio/voice/inbound-status {
        limit_except POST { deny all; }
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    location ~ "^/webhooks/twilio/voice/(twiml|status|stream-status|amd|recording)/[^/]+$" {
        limit_except POST { deny all; }
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    location ~ "^/webhooks/twilio/voice/connect-action/[^/]+/[0-9]+$" {
        limit_except POST { deny all; }
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # Signed, opaque audio callbacks are GET endpoints used by Twilio <Play>.
    # Keep them distinct so the POST-only callback policy cannot block them.
    location ~ "^/webhooks/twilio/voice/(private-audio|call-audio)/[^/]+$" {
        limit_except GET { deny all; }
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # Attachment upload API - longer upload timeouts, bounded request body, and
    # request buffering enabled so oversized multipart bodies are rejected before
    # they reach FastAPI.
    location ~ ^/api/conversations/[0-9]+/attachments/ {
        limit_req zone=general burst=50 nodelay;
        client_max_body_size 9m;
        client_body_timeout 180s;

        proxy_pass http://127.0.0.1:{{FASTAPI_PORT}};
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $aurvek_external_scheme;
        proxy_set_header X-Original-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        proxy_buffering off;
        proxy_request_buffering on;
    }

    # External device messages can carry up to 4 base64 snapshots. Keep this
    # aligned with the app-level MAX_DEVICE_MESSAGE_BODY_SIZE default.
    location = /api/devices/messages {
        limit_req zone=general burst=50 nodelay;
        client_max_body_size 64m;
        client_body_timeout 180s;

        proxy_pass http://127.0.0.1:{{FASTAPI_PORT}};
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $aurvek_external_scheme;
        proxy_set_header X-Original-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        proxy_buffering off;
        proxy_request_buffering on;
    }

    # API endpoints
    location ~ ^/(api|api-credentials)(/|$) {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # Media & Files
    location ~ ^/(media-gallery|get-audio|get-image|get-mp3s|get-pdfs|download-mp3|download-pdf|serve-mp3|delete-mp3|delete-mp3s|delete-pdf|delete-pdfs|delete-images|list-files)(/|$) {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # Payment
    location ~ ^/(payment|payment-success|apply-discount|process-discount|pack-purchase-success|prompt-purchase-success|purchase/prompt/[0-9]+)(/|$) {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # Internal & Auth (for nginx subrequests)
    location ~ ^/(auth-image|auth-file|internal|get-user-directory)(/|$) {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # Misc
    location ~ ^/(healthz|sdk|whatsapp|change-password)(/|$) {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # SEO: Dynamic sitemap
    location = /sitemap.xml {
        include {{SNIPPETS_PATH}}/fastapi-proxy.conf;
    }

    # --------------------------------------------------------------------------
    # WebSocket endpoint
    # --------------------------------------------------------------------------
    # Twilio's bidirectional Media Stream is a long-lived WebSocket. The exact
    # match must retain these call-sized timeouts rather than inherit the
    # generic five-minute /ws policy below. 18000 seconds gives a small proxy
    # margin around the configured technical call maximum.
    location = /ws/twilio/media-stream {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://127.0.0.1:{{FASTAPI_PORT}};
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $aurvek_external_scheme;
        proxy_set_header X-Original-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 18000s;
        proxy_read_timeout 18000s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /ws {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://127.0.0.1:{{FASTAPI_PORT}};
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $aurvek_external_scheme;

        # WebSocket required headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Longer timeouts for WebSocket
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # Landing page static assets.
    # Keep these uncached at nginx so the marketplace public-landings kill switch
    # is enforced by FastAPI immediately after a config reload.
    # MUST be before the general /p/ location (more specific regex wins)
    # --------------------------------------------------------------------------
    location ~ "^/p/[a-zA-Z0-9]{8}/[^/]+/static/" {
        limit_req zone=static burst=150 nodelay;

        proxy_pass http://127.0.0.1:{{FASTAPI_PORT}};
        proxy_http_version 1.1;

        # Headers for FastAPI
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $aurvek_external_scheme;

        # Enable buffering, but do not use proxy_cache for marketplace landings.
        proxy_buffering on;

        # Client caching
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # --------------------------------------------------------------------------
    # Public landing pages: /p/{public_id}/{slug}/...
    # --------------------------------------------------------------------------
    location ~ "^/p/[a-zA-Z0-9]{8}/[^/]+(/.*)?$" {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://127.0.0.1:{{FASTAPI_PORT}};
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $aurvek_external_scheme;
        proxy_set_header X-Original-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Prompt routes with numeric ID (legacy/internal): /{prompt_id}/{prompt_name}/...
    # --------------------------------------------------------------------------
    location ~ ^/[0-9]+/[^/]+/(register|home|chat)$ {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://127.0.0.1:{{FASTAPI_PORT}};
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $aurvek_external_scheme;
        proxy_set_header X-Original-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # User Profile Pictures (Authenticated)
    # Pattern: /users/{h1}/{h2}/{hash}/profile/{hash}_{size}.webp
    # --------------------------------------------------------------------------
    location ~ ^/users/[a-zA-Z0-9]{3}/[a-zA-Z0-9]{4}/[a-zA-Z0-9]+/profile/[a-zA-Z0-9]+(?:_[a-zA-Z0-9]+)*_(32|64|128|256|fullsize)\.(png|jpg|jpeg|gif|webp)$ {
        limit_req zone=static burst=150 nodelay;
        auth_request /auth-image;
        auth_request_set $auth_status $upstream_status;

        root "{{AURVEK_ROOT}}/data/";
        try_files $uri =404;

        if ($auth_status = 200) {
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
        }
        if ($auth_status = 401) {
            return 401;
        }
        if ($auth_status = 403) {
            return 403;
        }
    }

    # --------------------------------------------------------------------------
    # Conversation Images (Bot/User) - Authenticated
    # Pattern: /users/{h1}/{h2}/{hash}/files/{p1}/{p2}/img/{bot|user}/{hash}_{size}.webp
    # --------------------------------------------------------------------------
    location ~ ^/users/[a-zA-Z0-9]{3}/[a-zA-Z0-9]{4}/[a-zA-Z0-9]+/files/[0-9]{3}/[0-9]{4}/img/(bot|user)/[a-zA-Z0-9]+_(32|64|128|256|fullsize)\.(png|jpg|jpeg|gif|webp)$ {
        limit_req zone=static burst=150 nodelay;
        auth_request /auth-image;
        auth_request_set $auth_status $upstream_status;

        root "{{AURVEK_ROOT}}/data/";
        try_files $uri =404;

        if ($auth_status = 200) {
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
        }
        if ($auth_status = 401) {
            return 401;
        }
        if ($auth_status = 403) {
            return 403;
        }
    }

    # --------------------------------------------------------------------------
    # Prompt Avatars (Bot personality images) - Authenticated
    # Pattern: /users/{h1}/{h2}/{hash}/prompts/{p1}/{p2}_{name}/static/img/{file}_{size}.webp
    # --------------------------------------------------------------------------
    location ~ ^/users/[a-zA-Z0-9]{3}/[a-zA-Z0-9]{4}/[a-zA-Z0-9]+/prompts/[0-9]{3}/[0-9]{4}_[^/]+/static/img/[^/]+_(32|64|128|fullsize)\.(webp|png|jpg|jpeg|gif)$ {
        limit_req zone=static burst=150 nodelay;
        auth_request /auth-image;
        auth_request_set $auth_status $upstream_status;

        root "{{AURVEK_ROOT}}/data/";
        try_files $uri =404;

        if ($auth_status = 200) {
            add_header Cache-Control "public, max-age=28800";
            add_header X-Content-Type-Options "nosniff" always;
        }
        if ($auth_status = 401) {
            return 401;
        }
        if ($auth_status = 403) {
            return 403;
        }
    }

    # --------------------------------------------------------------------------
    # PDF and MP3 Files (Authenticated)
    # Pattern: .../files/{p1}/{p2}/mp3/{filename}.mp3 or pdf/(uploads/)?{filename}.pdf
    # --------------------------------------------------------------------------
    location ~ ^/users/[a-zA-Z0-9]{3}/[a-zA-Z0-9]{4}/[a-zA-Z0-9]+/files/[0-9]{3}/[0-9]{4}/(?:mp3/[^/]+\.mp3|pdf/(?:uploads/)?[^/]+\.pdf)$ {
        limit_req zone=static burst=100 nodelay;
        auth_request /auth-file;
        auth_request_set $auth_status $upstream_status;

        root "{{AURVEK_ROOT}}/data/";
        try_files $uri =404;

        # Handle download disposition
        set $download_header '';
        if ($is_download) {
            set $download_header "attachment; filename=$request_filename";
        }

        if ($auth_status = 200) {
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
        }
        if ($auth_status = 401) {
            return 401;
        }
        if ($auth_status = 403) {
            return 403;
        }
    }

    # --------------------------------------------------------------------------
    # Video Files (Authenticated)
    # Pattern: /users/{h1}/{h2}/{hash}/files/{p1}/{p2}/video/{bot|user}/{filename}.{mp4|webm|avi}
    # --------------------------------------------------------------------------
    location ~ ^/users/[a-zA-Z0-9]{3}/[a-zA-Z0-9]{4}/[a-zA-Z0-9]+/files/[0-9]{3}/[0-9]{4}/video/(bot|user)/[a-zA-Z0-9_]+\.(mp4|webm|avi)$ {
        limit_req zone=static burst=100 nodelay;
        auth_request /auth-file;
        auth_request_set $auth_status $upstream_status;

        root "{{AURVEK_ROOT}}/data/";
        try_files $uri =404;

        if ($auth_status = 200) {
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Accept-Ranges bytes;
        }
        if ($auth_status = 401) {
            return 401;
        }
        if ($auth_status = 403) {
            return 403;
        }
    }

    # Default-deny the user tree. The five authenticated regex locations above
    # are intentionally ordered first; every other user path returns 404.
    location ~ ^/users/ {
        return 404;
    }

    # --------------------------------------------------------------------------
    # Auth Endpoints (Internal)
    # --------------------------------------------------------------------------

    # Auth for images - proxies to FastAPI
    location = /auth-image {
        internal;
        limit_req zone=auth burst=15 nodelay;

        # Enable caching of auth responses
        proxy_cache auth_cache;
        proxy_cache_key $http_authorization$request_uri;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 401 403 1m;

        proxy_pass http://127.0.0.1:{{FASTAPI_PORT}}/auth-image?token=$extracted_token&request_uri=$clean_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;

        # Fallback to HTTPS if HTTP fails
        proxy_intercept_errors on;
        error_page 502 503 504 = @auth_image_https;
    }

    # Auth for files (PDF, MP3, video)
    location = /auth-file {
        internal;
        limit_req zone=auth burst=10 nodelay;

        proxy_cache auth_cache;
        proxy_cache_key $http_authorization$request_uri;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 401 403 1m;

        proxy_pass http://127.0.0.1:{{FASTAPI_PORT}}/auth-file?token=$extracted_token&request_uri=$clean_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @auth_file_https;
    }

    # HTTPS fallback for auth_image
    location @auth_image_https {
        internal;
        limit_req zone=auth burst=15 nodelay;
        proxy_cache auth_cache;
        proxy_cache_key $http_authorization$request_uri;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 401 403 1m;
        proxy_pass https://127.0.0.1:{{FASTAPI_PORT}}/auth-image?token=$extracted_token&request_uri=$clean_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # HTTPS fallback for auth_file
    location @auth_file_https {
        internal;
        limit_req zone=auth burst=10 nodelay;
        proxy_cache auth_cache;
        proxy_cache_key $http_authorization$request_uri;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 401 403 1m;
        proxy_pass https://127.0.0.1:{{FASTAPI_PORT}}/auth-file?token=$extracted_token&request_uri=$clean_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Protected internal alias for secure downloads
    location /protected/ {
        internal;
        alias "{{AURVEK_ROOT}}/data/";
    }

    # --------------------------------------------------------------------------
    # SSL Configuration
    # --------------------------------------------------------------------------
    ssl_certificate "{{SSL_CERT}}";
    ssl_certificate_key "{{SSL_KEY}}";
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    charset utf-8;

    # Standard exclusions
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.ht { deny all; }
}
